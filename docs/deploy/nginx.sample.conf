# H-D CPO Marketplace — sample nginx reverse-proxy config
# ---------------------------------------------------------------
# Three subdomains land on three SPA static dirs (Vite build output);
# all four call the same API via /api proxy. Adjust paths, certs, and
# upstream port to your environment.
#
# Pre-requisites:
#   - Apps built via `pnpm build` → outputs at apps/web-*/dist
#   - API running at 127.0.0.1:4000 (adjust upstream block if different)
#   - Let's Encrypt certs in /etc/letsencrypt/live/<domain>/
#   - dhparam at /etc/nginx/dhparam.pem (`openssl dhparam -out /etc/nginx/dhparam.pem 2048`)
# ---------------------------------------------------------------

# Hardened SSL defaults — share across all server blocks
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_dhparam /etc/nginx/dhparam.pem;
ssl_stapling on;
ssl_stapling_verify on;

# Upstream — single Express API serves all three panels
upstream hd_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Common gzip + cache settings — applied per-server
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    ~image/                    max;
    ~font/                     max;
    application/font-woff2     max;
}

# ---- HTTP → HTTPS redirect (all three subdomains) ---------------
server {
    listen 80;
    listen [::]:80;
    server_name hd-certified.in www.hd-certified.in dealer.hd-certified.in admin.hd-certified.in;

    # ACME challenge passthrough for Let's Encrypt renewals
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Buyer site — apex + www ------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hd-certified.in www.hd-certified.in;

    ssl_certificate     /etc/letsencrypt/live/hd-certified.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hd-certified.in/privkey.pem;

    # HSTS — only enable after you've confirmed HTTPS works for all
    # subdomains. Once set, browsers refuse plain HTTP for a year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tighten CSP after first prod rollout — start permissive, log violations.
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; ...";

    expires $expires;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /var/www/hd-cpo/web-buyer;
    index index.html;

    # API proxy — single Express handles every /api/v1/* call.
    location /api/ {
        proxy_pass http://hd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # SEO endpoints served by the API — Express dynamically generates these.
    location = /sitemap.xml { proxy_pass http://hd_api; }
    location = /robots.txt  { proxy_pass http://hd_api; }

    # Listing image cache — let nginx serve the static uploads directly
    # from the API's volume mount when behind the same host. Otherwise
    # this proxies to the API's `/api/v1/uploads/listing-images/...`
    location ~ ^/uploads/ {
        proxy_pass http://hd_api;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every unmatched route returns index.html so React Router
    # can render the right component. Asset 404s correctly return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- Dealer portal ---------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dealer.hd-certified.in;

    ssl_certificate     /etc/letsencrypt/live/dealer.hd-certified.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealer.hd-certified.in/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Dealer + admin panels are auth-gated; tell crawlers explicitly to skip.
    add_header X-Robots-Tag "noindex, nofollow" always;

    expires $expires;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/hd-cpo/web-dealer;
    index index.html;

    location /api/ {
        proxy_pass http://hd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- Admin portal ----------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.hd-certified.in;

    ssl_certificate     /etc/letsencrypt/live/admin.hd-certified.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.hd-certified.in/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional — IP allowlist for admin panel. Comment out if not needed.
    # allow 203.0.113.0/24;
    # deny all;

    expires $expires;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/hd-cpo/web-admin;
    index index.html;

    location /api/ {
        proxy_pass http://hd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
