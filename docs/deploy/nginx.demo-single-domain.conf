# ─────────────────────────────────────────────────────────────────────
# H-D CPO Marketplace — single-domain demo nginx (Orange Mantra)
#
# This config locks the customer out of /dealer + /admin on the public
# buyer hostname AND moves the dealer + admin SPAs onto subdomains.
# Production should use docs/deploy/nginx.sample.conf which has the
# same separation by default. This file exists for the demo box that
# currently serves all three SPAs on a single hostname.
#
# Steps the ops team must take, in order:
#   1. Add two A-records:
#        dealer.harleydavidson.ciadmin.in → <demo-server-IP>
#        admin.harleydavidson.ciadmin.in  → <demo-server-IP>
#   2. Issue Let's Encrypt certs:
#        certbot --nginx -d dealer.harleydavidson.ciadmin.in \
#                        -d admin.harleydavidson.ciadmin.in
#   3. Drop this file into /etc/nginx/sites-available/, symlink into
#      sites-enabled, run `nginx -t && systemctl reload nginx`.
#   4. Build the dealer + admin SPAs with the new env vars so the
#      runtime hostname guard activates:
#        # apps/web-dealer/.env.production
#        VITE_PORTAL_HOSTNAME=dealer.harleydavidson.ciadmin.in
#        VITE_BUYER_URL=https://harleydavidson.ciadmin.in
#        # apps/web-admin/.env.production
#        VITE_PORTAL_HOSTNAME=admin.harleydavidson.ciadmin.in
#        VITE_BUYER_URL=https://harleydavidson.ciadmin.in
#
# After step 4 the SPA itself bounces any wrong-host visitor back to the
# buyer site BEFORE rendering the login screen — so even if a customer
# pokes at harleydavidson.ciadmin.in/dealer the nginx 404 (below) catches
# it; and if for any reason nginx ever serves it again, the SPA hostname
# guard catches it too. Two locks.
# ─────────────────────────────────────────────────────────────────────

upstream hd_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ─── Buyer site (public) ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name harleydavidson.ciadmin.in;

    ssl_certificate     /etc/letsencrypt/live/harleydavidson.ciadmin.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harleydavidson.ciadmin.in/privkey.pem;

    root /var/www/hd-cpo/web-buyer;
    index index.html;

    # ── Customer-isolation block ────────────────────────────────────
    # Any URL beginning with /dealer or /admin on the public buyer
    # hostname returns a hard 404. The dealer + admin SPAs are served
    # from their own subdomains (server blocks below) so legit dealers
    # /admins just bookmark dealer.harleydavidson.ciadmin.in directly.
    #
    # No redirect — we don't want a curious customer following a 301
    # over to the dealer subdomain. They get a flat 404 like any other
    # non-existent path.
    location ^~ /dealer { return 404; }
    location ^~ /admin  { return 404; }
    # ────────────────────────────────────────────────────────────────

    location /api/ {
        proxy_pass http://hd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml { proxy_pass http://hd_api; }
    location = /robots.txt  { proxy_pass http://hd_api; }

    location ~ ^/uploads/ {
        proxy_pass http://hd_api;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Dealer portal (private subdomain) ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name dealer.harleydavidson.ciadmin.in;

    ssl_certificate     /etc/letsencrypt/live/dealer.harleydavidson.ciadmin.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealer.harleydavidson.ciadmin.in/privkey.pem;

    # Tell crawlers explicitly to skip — defence-in-depth on top of robots.txt.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/hd-cpo/web-dealer;
    index index.html;

    location /api/ {
        proxy_pass http://hd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Admin portal (private subdomain) ───────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.harleydavidson.ciadmin.in;

    ssl_certificate     /etc/letsencrypt/live/admin.harleydavidson.ciadmin.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.harleydavidson.ciadmin.in/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Optional extra lock — IP allowlist for admin only. Uncomment +
    # populate when you have the office / VPN ranges handy.
    # allow 203.0.113.0/24;
    # deny all;

    root /var/www/hd-cpo/web-admin;
    index index.html;

    location /api/ {
        proxy_pass http://hd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
