# Apache reverse-proxy config for harleydavidson.ciadmin.in
# ----------------------------------------------------------
# Single domain, three React SPAs + one API behind subpath routing:
#
#   /          → buyer  (Vite dev :5180, base "/")
#   /dealer/   → dealer (Vite dev :5181, base "/dealer/")
#   /admin/    → admin  (Vite dev :5182, base "/admin/")
#   /api/      → API    (Express :4001)
#   /docs/     → Swagger (Express :4001 /docs)
#
# Three things must agree for subpath routing to work:
#
#   1. Vite `base` config in each app           ← apps/web-{dealer,admin}/vite.config.ts
#   2. React Router `basename` prop             ← apps/web-{dealer,admin}/src/main.tsx
#   3. Apache ProxyPass passes the prefix       ← THIS FILE
#
# All three are now aligned on commit fbf0… in harley-react. Pull, restart
# `pnpm dev`, swap this conf in, reload Apache.
#
# Required modules (a2enmod):
#   proxy proxy_http proxy_wstunnel rewrite headers ssl
# proxy_wstunnel is what makes Vite HMR work over HTTPS — without it the
# app still loads but you'll see WebSocket errors in DevTools and lose
# hot-module updates.

AllowEncodedSlashes NoDecode

<VirtualHost *:80>
    ServerName harleydavidson.ciadmin.in
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName harleydavidson.ciadmin.in

    ########################################################
    # SSL
    ########################################################
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/harleydavidson.ciadmin.in/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/harleydavidson.ciadmin.in/privkey.pem
    Include                 /etc/letsencrypt/options-ssl-apache.conf

    ########################################################
    # Proxy / WebSocket basics
    ########################################################
    ProxyPreserveHost On
    ProxyRequests Off
    SSLProxyEngine On

    RewriteEngine On

    # Bare /dealer / /admin (no trailing slash) → 301 to /dealer/ /admin/.
    # Done via RewriteRule (NOT RedirectMatch) so the rule fires in the
    # URL-translation phase BEFORE the ProxyPass catch-all `/` runs;
    # otherwise the catch-all proxies `/dealer` to the buyer Vite (port
    # 5180) and the user sees the buyer's 404 page instead of the dealer.
    RewriteRule ^/dealer$ /dealer/ [R=301,L]
    RewriteRule ^/admin$  /admin/  [R=301,L]

    # WebSocket upgrade for Vite HMR — must come BEFORE the catch-all
    # ProxyPass rules. Targets each app's own port based on URI prefix.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/dealer/(.*)$  ws://127.0.0.1:5181/dealer/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/admin/(.*)$   ws://127.0.0.1:5182/admin/$1  [P,L]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$         ws://127.0.0.1:5180/$1        [P,L]

    ########################################################
    # Security Headers
    ########################################################
    Header always set X-Frame-Options       SAMEORIGIN
    Header always set X-Content-Type-Options nosniff
    Header always set X-XSS-Protection      "1; mode=block"

    ########################################################
    # API Backend
    ########################################################
    ProxyPass        /api/  http://127.0.0.1:4001/api/
    ProxyPassReverse /api/  http://127.0.0.1:4001/api/

    ########################################################
    # Swagger Docs
    ########################################################
    ProxyPass        /docs  http://127.0.0.1:4001/docs
    ProxyPassReverse /docs  http://127.0.0.1:4001/docs

    ########################################################
    # DEALER FRONTEND  (Vite base = "/dealer/")
    # CRITICAL: keep the trailing /dealer/ on BOTH sides — Vite expects
    # the base prefix in the URL it receives. The previous config
    # `ProxyPass /dealer http://127.0.0.1:5181/` stripped the prefix
    # which broke asset / @vite / @fs resolution.
    ########################################################
    ProxyPass        /dealer/  http://127.0.0.1:5181/dealer/  nocanon
    ProxyPassReverse /dealer/  http://127.0.0.1:5181/dealer/

    ########################################################
    # ADMIN FRONTEND  (Vite base = "/admin/")
    ########################################################
    ProxyPass        /admin/  http://127.0.0.1:5182/admin/  nocanon
    ProxyPassReverse /admin/  http://127.0.0.1:5182/admin/

    ########################################################
    # BUYER FRONTEND  (Vite base = "/")
    # Catch-all — must be LAST.
    ########################################################
    ProxyPass        /  http://127.0.0.1:5180/  nocanon
    ProxyPassReverse /  http://127.0.0.1:5180/

    ########################################################
    # LOGS
    ########################################################
    ErrorLog  ${APACHE_LOG_DIR}/harley-error.log
    CustomLog ${APACHE_LOG_DIR}/harley-access.log combined
</VirtualHost>
