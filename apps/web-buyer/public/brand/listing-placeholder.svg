<?xml version="1.0" encoding="UTF-8"?>
<!--
  Local fallback for listing image cards / detail galleries when:
  (a) the dealer hasn't uploaded any photos yet (DRAFT row), or
  (b) the upload URL 404s mid-render.
  Sized 600x450 (4:3, the listing-card aspect) and inlined as SVG so it
  costs ~1KB instead of pinging placehold.co (which fails on locked-down
  corporate networks and can rate-limit under traffic spikes).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Photo coming soon">
  <rect width="600" height="450" fill="#0F0F0F"/>
  <g transform="translate(300 225)" fill="none" stroke="#FF6600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-60" cy="0" r="38"/>
    <circle cx="60" cy="0" r="38"/>
    <line x1="-60" y1="0" x2="60" y2="0"/>
    <line x1="-60" y1="0" x2="-30" y2="-50"/>
    <line x1="60" y1="0" x2="35" y2="-45"/>
    <line x1="35" y1="-45" x2="-30" y2="-50"/>
  </g>
  <text
    x="300"
    y="335"
    text-anchor="middle"
    font-family="Helvetica, Arial, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="3"
    fill="#FFFFFF"
  >PHOTO COMING SOON</text>
  <text
    x="300"
    y="360"
    text-anchor="middle"
    font-family="Helvetica, Arial, sans-serif"
    font-size="11"
    letter-spacing="2"
    fill="#888888"
  >H-D CERTIFIED</text>
</svg>
