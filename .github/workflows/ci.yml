name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hdcpo
          POSTGRES_PASSWORD: hdcpo_ci_password
          POSTGRES_DB: hd_cpo_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hdcpo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hdcpo:hdcpo_ci_password@localhost:5432/hd_cpo_marketplace?schema=public
      REDIS_URL: mock://
      EMBEDDED_DB: 0
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-not-for-production-use-32chars-min
      JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret-not-for-production-use-32chars-min
      OTP_VERIFIED_TOKEN_SECRET: ci-only-otp-token-secret-not-for-production-use-32chars-min
      PII_ENCRYPTION_KEY: ci-only-pii-encryption-key-not-production-use-32chars
      SMS_PROVIDER: mock
      EMAIL_PROVIDER: mock
      TORQUE_MODE: mock
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5180,http://localhost:5181,http://localhost:5182

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hd-cpo/api prisma:generate

      - name: Apply migrations against CI database
        run: pnpm --filter @hd-cpo/api prisma:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Build all apps + packages
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hdcpo
          POSTGRES_PASSWORD: hdcpo_ci_password
          POSTGRES_DB: hd_cpo_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hdcpo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hdcpo:hdcpo_ci_password@localhost:5432/hd_cpo_marketplace?schema=public
      REDIS_URL: mock://
      EMBEDDED_DB: 0
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-not-for-production-use-32chars-min
      JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret-not-for-production-use-32chars-min
      OTP_VERIFIED_TOKEN_SECRET: ci-only-otp-token-secret-not-for-production-use-32chars-min
      PII_ENCRYPTION_KEY: ci-only-pii-encryption-key-not-production-use-32chars
      SMS_PROVIDER: mock
      EMAIL_PROVIDER: mock
      TORQUE_MODE: mock
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5180,http://localhost:5181,http://localhost:5182

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @hd-cpo/e2e exec playwright install --with-deps chromium

      - name: Generate Prisma client + apply migrations
        run: |
          pnpm --filter @hd-cpo/api prisma:generate
          pnpm --filter @hd-cpo/api prisma:deploy

      - name: Run E2E tests
        run: pnpm --filter @hd-cpo/e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: e2e/playwright-report
          retention-days: 14
