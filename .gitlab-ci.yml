# ─────────────────────────────────────────────────────────────────────────────
# H-D CPO — GitLab CI/CD (Webhook-based, no SSH key needed)
#
# Push to main → GitLab calls webhook → Server runs deploy.sh automatically
#
# ONE-TIME SETUP:
#   1. Server pe: pm2 start ecosystem.config.cjs  (webhook listener shuru hoga)
#   2. GitLab → Settings → Webhooks:
#        URL: http://YOUR_SERVER_IP:9000/deploy
#        Secret Token: hd-cpo-deploy-secret  (ecosystem.config.cjs se match kare)
#        Trigger: Push events ✓
#        Branch filter: main
# ─────────────────────────────────────────────────────────────────────────────

# No CI jobs needed — GitLab webhook directly triggers the server.
# This file documents the webhook setup for the team.

stages:
  - notify

webhook-deploy:
  stage: notify
  only:
    - main
  image: alpine:latest
  script:
    - echo "Push to main detected."
    - echo "GitLab webhook will trigger auto-deploy on the server."
    - echo "Check deploy logs at: server → logs/deploy.log"
    - echo "Check webhook logs at: pm2 logs hd-cpo-webhook"
